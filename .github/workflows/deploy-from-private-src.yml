name: deploy-from-private-src

# Déploie le site podcast sur GitHub Pages SANS les audios.
# Les .m4a sont servis par R2 (https://media.fox3000foxy.com/files/...),
# ici on ne publie que le flux RSS + métadonnées (~700 Ko -> déploiement en secondes).
# Aucun .m4a n'est jamais commité sur ce repo public.

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      src_ref:
        description: 'Ref of podcast-src to deploy (branch, tag or SHA)'
        required: false
        default: 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private podcast-src (feed only)
        uses: actions/checkout@v4
        with:
          repository: fox3000foxy/podcast-src
          token: ${{ secrets.SRC_READ_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.src_ref }}
          path: src
          fetch-depth: 1
          sparse-checkout: |
            index.html
            playlist.xspf
            feed-vlc.xml
            track_numbers.json
          sparse-checkout-cone-mode: false

      - name: Assemble static site (feed only, no audio)
        run: |
          set -euo pipefail
          mkdir -p site
          cp src/index.html site/index.html
          cp src/playlist.xspf site/playlist.xspf
          cp src/feed-vlc.xml site/feed-vlc.xml
          cp src/track_numbers.json site/track_numbers.json
          touch site/.nojekyll
          du -sh site
          grep -c '<item>' site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
